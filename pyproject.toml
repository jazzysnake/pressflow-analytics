[project]
name = "pressflow"
version = "0.1.0"
description = "Sentiment analysis of Hungarian forum posts and backtesting of a long-only trading signal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "pandas",
    "pyarrow",
    "pyyaml",
    "yfinance",
]

[project.optional-dependencies]
# Heavy ML stack: declared but NOT installed by default. Install with:
#   uv sync --extra ml
ml = [
    "transformers",
    "torch",
    "sentencepiece",  # slow XLM-R tokenizer for cardiffnlp/...
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only PyTorch wheel: the default torch build pulls multi-GB CUDA
# libraries that are useless for this CPU inference/eval workflow.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/pressflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
