[project]
name = "pressflow"
version = "0.1.0"
description = "Sentiment analysis of Hungarian forum posts and backtesting of a long-only trading signal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "pandas",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
# Heavy ML stack: declared but NOT installed by default. Install with:
#   uv sync --extra ml
ml = [
    "yfinance",
    "transformers",
    "torch",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pressflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
